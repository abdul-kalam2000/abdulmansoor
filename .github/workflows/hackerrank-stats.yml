name: Update HackerRank Stats

on:
  schedule:
    # Runs every day at midnight
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # Use a community HackerRank action or custom script to pull stats
      # Note: Replace 'your-action-name' with a verified marketplace action like 'johndoe/hackerrank-stats'
      - name: HackerRank Stats Action
        uses: t-richard/hackerrank-readme-stats@v1.0 # Example community action
        with:
          username: https://www.hackerrank.com/profile/abdulmansoor
          
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update HackerRank stats" || exit 0
          git push
